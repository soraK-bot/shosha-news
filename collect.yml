name: ニュース収集

# 自動実行のスケジュール（UTC表記）。日本時間で 7時・12時・19時 ごろに動く。
on:
  schedule:
    - cron: "0 22 * * *"   # JST 7:00
    - cron: "0 3 * * *"    # JST 12:00
    - cron: "0 10 * * *"   # JST 19:00
  workflow_dispatch:        # 手動実行ボタン用

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: ニュースを収集
        env:
          # AI要約を使う場合は、リポジトリの Secrets に ANTHROPIC_API_KEY を登録する。
          # 未登録でもエラーにはならず、要約なしで動く。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collect.py

      - name: 変更を保存（コミット）
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "新しいニュースはありませんでした。"
          else
            git commit -m "ニュース自動更新 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
