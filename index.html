<meta name="claude:viewport-fit-sides" content="cover">
<title>商社就活ニュース</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1f3a5f">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  /* レイアウト概念: スマホ縦1カラム。固定ヘッダー(タイトル+検索+絞り込み)の下に記事カードを積む。 */
  :root{
    --bg:#f5f4f1; --surface:#ffffff; --surface-2:#fbfaf8;
    --fg:#1a1f2b; --muted:#616b7a; --line:#e6e3dc;
    --accent:#1f3a5f; --accent-ink:#1f3a5f; --accent-soft:#e9eff6;
    --sogo-bg:#e7edf5; --sogo-ink:#28426a;
    --senmon-bg:#e8f1ec; --senmon-ink:#2f6b4f;
    --tag-bg:#f0eee8; --tag-ink:#5a5244;
    --font-display:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
    --font-body:"Noto Sans JP",system-ui,-apple-system,sans-serif;
    --r:14px; --maxw:640px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#13161c; --surface:#1b1f27; --surface-2:#1f242d;
    --fg:#eceef2; --muted:#98a1b0; --line:#2b313c;
    --accent:#7aa6d6; --accent-ink:#9cc0e6; --accent-soft:#223243;
    --sogo-bg:#20303f; --sogo-ink:#9cc0e6;
    --senmon-bg:#1e3329; --senmon-ink:#7fc39e;
    --tag-bg:#262a31; --tag-ink:#b7b0a2;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#13161c; --surface:#1b1f27; --surface-2:#1f242d;
    --fg:#eceef2; --muted:#98a1b0; --line:#2b313c;
    --accent:#7aa6d6; --accent-ink:#9cc0e6; --accent-soft:#223243;
    --sogo-bg:#20303f; --sogo-ink:#9cc0e6;
    --senmon-bg:#1e3329; --senmon-ink:#7fc39e;
    --tag-bg:#262a31; --tag-ink:#b7b0a2;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);
    line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
    background:var(--accent);z-index:30}

  .wrap{max-width:var(--maxw);margin:0 auto}

  /* ---- ヘッダー ---- */
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    background:var(--accent);color:#fff}
  .head-inner{max-width:var(--maxw);margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:12px 10px}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .brand h1{font-family:var(--font-display);font-weight:700;font-size:1.18rem;
    margin:0;letter-spacing:.02em}
  .brand .meta{font-size:.72rem;opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
  .search{margin-top:10px;position:relative}
  .search input{width:100%;border:0;border-radius:11px;padding:10px 12px 10px 38px;
    font-size:.95rem;font-family:inherit;background:rgba(255,255,255,.95);color:#1a1f2b}
  .search input::placeholder{color:#8a93a0}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;opacity:.55}
  .search input:focus{outline:2px solid #fff;outline-offset:1px}

  /* ---- 絞り込みチップ ---- */
  .filters{background:var(--surface);border-bottom:1px solid var(--line);
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 0px);z-index:10}
  .chip-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:10px}
  .chip-row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);
    color:var(--fg);border-radius:999px;padding:6px 13px;font-size:.84rem;
    font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
  .tag-wrap{border-top:1px dashed var(--line)}
  .tag-row{flex-wrap:wrap;overflow:visible}
  .chip.tag{font-size:.8rem;padding:5px 11px}
  .chip.tag::before{content:"#";opacity:.5;margin-right:1px}
  .chip.tag[aria-pressed="true"]::before{opacity:.8}

  /* ---- リスト ---- */
  main{max-width:var(--maxw);margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:14px 40px}
  .count{font-size:.78rem;color:var(--muted);margin:2px 2px 12px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sample-flag{background:#f4e6c3;color:#6b541a;border-radius:6px;
    padding:2px 8px;font-size:.72rem;font-weight:500}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sample-flag{background:#3a3115;color:#e4cf90}}
  :root[data-theme="dark"] .sample-flag{background:#3a3115;color:#e4cf90}
  .list{display:flex;flex-direction:column;gap:12px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
  .card .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;
    font-family:var(--font-display)}
  .badge.sogo{background:var(--sogo-bg);color:var(--sogo-ink)}
  .badge.senmon{background:var(--senmon-bg);color:var(--senmon-ink)}
  .card a.title{font-family:var(--font-display);font-weight:700;font-size:1.02rem;
    line-height:1.45;color:var(--fg);text-decoration:none;text-wrap:balance}
  .card a.title:hover{color:var(--accent-ink)}
  .card .src{font-size:.75rem;color:var(--muted);display:flex;gap:6px;align-items:center;
    font-variant-numeric:tabular-nums}
  .card .src .dot{width:3px;height:3px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .card .summary{font-size:.9rem;color:var(--fg);opacity:.92;margin:0}
  .card .hashtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
  .htag{font-size:.78rem;color:var(--accent-ink);background:var(--tag-bg);
    border:0;border-radius:7px;padding:3px 9px;cursor:pointer;font-family:inherit;
    font-weight:500}
  .htag:hover{background:var(--accent-soft)}
  .htag:focus-visible{outline:2px solid var(--accent-ink);outline-offset:1px}

  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:.92rem}
  .empty b{color:var(--fg)}
  .reset{margin-top:14px;background:var(--accent);color:#fff;border:0;border-radius:10px;
    padding:9px 16px;font-size:.86rem;cursor:pointer;font-family:inherit}

  footer{max-width:var(--maxw);margin:0 auto;color:var(--muted);font-size:.72rem;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:0 32px;line-height:1.7}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ===== Phase A 追加分 ===== */
  :root{--danger:#b5462f}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--danger:#e3937a}}
  :root[data-theme="dark"]{--danger:#e3937a}

  /* 下部メニュー分の余白を確保 */
  main{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .view[hidden]{display:none!important}

  /* 記事カードの操作ボタン */
  .card .actions{display:flex;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap}
  .act{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);
    border-radius:9px;padding:6px 12px;font-size:.82rem;font-weight:500;cursor:pointer;
    font-family:inherit;display:inline-flex;align-items:center;gap:5px}
  .act:hover{border-color:var(--accent)}
  .act:focus-visible{outline:2px solid var(--accent-ink);outline-offset:1px}
  .act.saved{background:var(--accent);border-color:var(--accent);color:#fff}
  .act .ic{font-size:.95rem;line-height:1}
  .card .saved-in{font-size:.74rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;
    align-items:center}
  .card .saved-in b{color:var(--accent-ink);font-weight:600}
  .memo-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent-ink)}

  /* 「準備中」カード */
  .soon{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:26px 18px;text-align:center;color:var(--muted);margin-top:8px}
  .soon h2{font-family:var(--font-display);color:var(--fg);font-size:1.05rem;margin:0 0 8px}
  .soon p{margin:4px 0;font-size:.9rem;line-height:1.7}

  /* スクラップ一覧 */
  .panel-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 14px}
  .pbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);
    border-radius:10px;padding:8px 14px;font-size:.86rem;font-weight:600;cursor:pointer;
    font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .pbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .pbtn:focus-visible{outline:2px solid var(--accent-ink);outline-offset:1px}
  .pbtn.ghost{background:transparent}
  .pbtn.danger{color:var(--danger);border-color:var(--danger)}

  .scrap-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    cursor:pointer;min-width:0}
  .scrap-card:hover{border-color:var(--accent)}
  .scrap-card .sc-name{font-family:var(--font-display);font-weight:700;font-size:1rem;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scrap-card .sc-count{flex:0 0 auto;font-size:.8rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .scrap-card.system{border-style:dashed}

  .detail-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .detail-head h2{font-family:var(--font-display);font-size:1.1rem;margin:0;flex:1;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);
    border-radius:9px;width:38px;height:38px;flex:0 0 auto;cursor:pointer;font-size:1rem;
    display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
  .iconbtn:focus-visible{outline:2px solid var(--accent-ink);outline-offset:1px}

  .hint{font-size:.78rem;color:var(--muted);line-height:1.7;margin:10px 2px 0}

  /* 下部タブバー */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;
    background:var(--surface);border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:env(safe-area-inset-left,0px);
    padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{flex:1;background:none;border:0;cursor:pointer;font-family:inherit;
    color:var(--muted);padding:9px 2px 8px;display:flex;flex-direction:column;
    align-items:center;gap:3px;font-size:.68rem;font-weight:500}
  .tabbar button .ti{width:23px;height:23px;display:block}
  .tabbar button[aria-current="true"]{color:var(--accent-ink)}
  .tabbar button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:-3px}

  /* ボトムシート（記事の保存・メモ / バックアップ） */
  .sheet-host{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;
    justify-content:center}
  .sheet-host[hidden]{display:none!important}
  .sheet-bg{position:absolute;inset:0;background:rgba(10,14,20,.5)}
  .sheet{position:relative;background:var(--bg);width:100%;max-width:var(--maxw);
    max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;
    padding:16px max(16px,env(safe-area-inset-left,0px))
      calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
    animation:slideup .22s ease}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
  .sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);
    margin:0 auto 14px}
  .sheet h3{font-family:var(--font-display);font-size:1.02rem;margin:0 0 4px;line-height:1.45}
  .sheet .s-src{font-size:.76rem;color:var(--muted);margin:0 0 16px}
  .sheet .s-sec{margin:0 0 18px}
  .sheet .s-sec > .lbl{font-size:.82rem;font-weight:700;color:var(--fg);display:block;
    margin:0 0 9px;font-family:var(--font-display)}
  .scrap-opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
  .opt input{width:19px;height:19px;flex:0 0 auto;accent-color:var(--accent)}
  .opt span{font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .newscrap{display:flex;gap:8px;margin-top:4px}
  .newscrap input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;font-size:.9rem;font-family:inherit;background:var(--surface);color:var(--fg)}
  .newscrap input:focus{outline:2px solid var(--accent-ink);outline-offset:-1px}
  .memo-field{margin-bottom:12px}
  .memo-field label{font-size:.8rem;color:var(--muted);display:block;margin:0 0 5px}
  .memo-field textarea{width:100%;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:.92rem;font-family:inherit;background:var(--surface);
    color:var(--fg);resize:vertical;min-height:58px;line-height:1.6}
  .memo-field textarea:focus{outline:2px solid var(--accent-ink);outline-offset:-1px}
  .sheet-actions{display:flex;gap:10px;margin-top:6px}
  .sheet-actions .pbtn{flex:1;justify-content:center;padding:12px}
  .backup-area{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;
    font-size:.82rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    background:var(--surface);color:var(--fg);min-height:120px;resize:vertical;line-height:1.5}
  /* 週次ダイジェスト */
  .dg-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:8px 10px;margin:2px 0 16px}
  .dg-nav button{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);
    border-radius:9px;padding:8px 12px;font-size:.82rem;font-weight:600;cursor:pointer;
    font-family:inherit;white-space:nowrap}
  .dg-nav button:disabled{opacity:.4;cursor:default}
  .dg-nav button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:1px}
  .dg-range{font-family:var(--font-display);font-weight:700;font-size:.92rem;text-align:center;
    min-width:0;font-variant-numeric:tabular-nums}
  .dg-sec{margin:0 0 10px}
  .dg-sec-title{display:flex;align-items:baseline;gap:8px;margin:20px 2px 11px}
  .dg-sec-title h2{font-family:var(--font-display);font-size:1.02rem;margin:0;
    display:flex;align-items:center;gap:7px}
  .dg-sec-title .cat{font-size:.68rem;font-weight:700;border-radius:5px;padding:1px 7px;
    font-family:var(--font-display)}
  .dg-sec-title .cat.sogo{background:var(--sogo-bg);color:var(--sogo-ink)}
  .dg-sec-title .cat.senmon{background:var(--senmon-bg);color:var(--senmon-ink)}
  .dg-sec-title .sub{font-size:.74rem;color:var(--muted)}
  .dg-top .dg-sec-title h2::before{content:"★";color:var(--accent-ink);font-size:.95rem}
  .dg-empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);
    padding:30px 18px;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.7}
  .rank{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;
    font-size:.78rem;font-weight:700;font-family:var(--font-display)}
  .card .rankline{display:flex;align-items:center;gap:8px}
  .mediacount{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}

  .toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;
    border-radius:10px;font-size:.84rem;z-index:50;opacity:0;transition:opacity .2s;
    pointer-events:none;max-width:88%;text-align:center}
  .toast.show{opacity:.96}
</style>

<header>
  <div class="head-inner">
    <div class="brand">
      <h1 id="viewTitle">商社就活ニュース</h1>
      <span class="meta" id="meta"></span>
    </div>
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5b6472" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="q" type="search" placeholder="キーワードで検索（社名・事業・メディア）" autocomplete="off">
    </div>
  </div>
</header>

<div class="filters" id="filters">
  <div class="wrap">
    <div class="chip-row" id="companyRow" role="group" aria-label="会社で絞り込み"></div>
    <div class="tag-wrap"><div class="chip-row tag-row" id="tagRow" role="group" aria-label="タグで絞り込み"></div></div>
  </div>
</div>

<main>
  <section id="view-news" class="view">
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
    <footer id="foot"></footer>
  </section>

  <section id="view-scraps" class="view" hidden>
    <div id="scrapsPanel"></div>
  </section>

  <section id="view-digest" class="view" hidden>
    <div id="digestPanel"></div>
  </section>

  <section id="view-companies" class="view" hidden>
    <div class="soon">
      <h2>個社研究（準備中）</h2>
      <p>各社の基本情報・経営理念・採用スローガン・中期経営計画などをまとめて見られるページです。</p>
      <p>次の次の段階（C）で追加します。</p>
    </div>
  </section>
</main>

<nav class="tabbar" id="tabbar" aria-label="メニュー">
  <button data-view="news" aria-current="true">
    <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
    ニュース
  </button>
  <button data-view="scraps">
    <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
    スクラップ
  </button>
  <button data-view="digest">
    <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    ダイジェスト
  </button>
  <button data-view="companies">
    <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V8l6-4 6 4v12M4 20h12M9 20v-4h2v4M8 11h.5M12 11h.5M8 14h.5M12 14h.5"/><path d="M16 20h4V12l-4-2"/></svg>
    企業
  </button>
</nav>

<div class="sheet-host" id="sheetHost" hidden></div>

<script>
(function(){
  "use strict";
  var DATA = null;
  var state = { scope:"all", tag:null, q:"" };
  var companyMap = {};
  var currentView = "news";
  var scrapView = { mode:"list", scrapId:null };  // list | detail | backup
  var weekOffset = 0;  // 0=今週, 1=先週, ...

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function relTime(iso){
    var d=new Date(iso), now=new Date(), ms=now-d;
    if(isNaN(d)) return "";
    var min=Math.floor(ms/60000), h=Math.floor(min/60), day=Math.floor(h/24);
    if(min<1) return "たった今";
    if(min<60) return min+"分前";
    if(h<24) return h+"時間前";
    if(day<7) return day+"日前";
    return (d.getMonth()+1)+"月"+d.getDate()+"日";
  }

  function loadFallback(){
    try{ return JSON.parse(document.getElementById("fallback").textContent); }
    catch(e){ return {companies:[],tags:[],articles:[]}; }
  }

  /* =========================================================
     保存データ（スクラップ＆メモ）: iPhone内の localStorage に保存
     ========================================================= */
  var STORE_KEY = "shosha_store_v1";
  var STORE = { v:1, scraps:[], items:{} };
  var storageOK = true;

  function loadStore(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){ var p=JSON.parse(raw); if(p && typeof p==="object"){
        STORE = { v:1, scraps:p.scraps||[], items:p.items||{} };
      }}
    }catch(e){ storageOK=false; }
  }
  function saveStore(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); }
    catch(e){ storageOK=false; toast("保存できませんでした（端末の設定をご確認ください）"); }
  }
  function uid(){ return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  function emptyMemo(){ return {opinion:"",talk:"",question:"",other:""}; }
  function memoHasText(m){ return !!(m && (m.opinion||m.talk||m.question||m.other)); }

  function getItem(id){ return STORE.items[id]||null; }
  function ensureItem(art){
    if(!STORE.items[art.id]){
      STORE.items[art.id] = {
        art:{id:art.id,title:art.title,url:art.url,source:art.source,
             published:art.published,company_ids:art.company_ids||[],
             tags:art.tags||[],summary:art.summary||""},
        scraps:[], memo:emptyMemo(), savedAt:new Date().toISOString()
      };
    } else {
      STORE.items[art.id].art = {id:art.id,title:art.title,url:art.url,source:art.source,
        published:art.published,company_ids:art.company_ids||[],tags:art.tags||[],summary:art.summary||""};
    }
    return STORE.items[art.id];
  }
  function cleanupItem(id){
    var it=STORE.items[id];
    if(it && it.scraps.length===0 && !memoHasText(it.memo)) delete STORE.items[id];
  }
  function createScrap(name){
    var s={id:uid(),name:name||"無題のスクラップ",created:new Date().toISOString()};
    STORE.scraps.push(s); saveStore(); return s.id;
  }
  function renameScrap(id,name){
    var s=STORE.scraps.find(function(x){return x.id===id;}); if(s){s.name=name;saveStore();}
  }
  function deleteScrap(id){
    STORE.scraps = STORE.scraps.filter(function(x){return x.id!==id;});
    Object.keys(STORE.items).forEach(function(k){
      var it=STORE.items[k];
      it.scraps = it.scraps.filter(function(sid){return sid!==id;});
      cleanupItem(k);
    });
    saveStore();
  }
  function scrapName(id){ var s=STORE.scraps.find(function(x){return x.id===id;}); return s?s.name:""; }
  function scrapCount(id){
    return Object.keys(STORE.items).filter(function(k){
      return STORE.items[k].scraps.indexOf(id)>=0; }).length;
  }
  function itemsInScrap(id){
    return Object.keys(STORE.items).map(function(k){return STORE.items[k];})
      .filter(function(it){return it.scraps.indexOf(id)>=0;})
      .sort(function(a,b){return new Date(b.art.published)-new Date(a.art.published);});
  }
  function memoOnlyItems(){
    return Object.keys(STORE.items).map(function(k){return STORE.items[k];})
      .filter(function(it){return it.scraps.length===0 && memoHasText(it.memo);})
      .sort(function(a,b){return new Date(b.art.published)-new Date(a.art.published);});
  }

  function toast(msg){
    var t=document.getElementById("toast");
    t.textContent=msg; t.classList.add("show");
    clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("show");},2200);
  }

  function boot(data){
    DATA = data || loadFallback();
    (DATA.companies||[]).forEach(function(c){ companyMap[c.id]=c; });
    loadStore();
    renderChrome();
    render();
  }

  // 会社チップ・タグチップ・更新情報
  function renderChrome(){
    var meta=document.getElementById("meta");
    var upd = DATA.updated_at ? new Date(DATA.updated_at) : null;
    meta.textContent = upd ? ("更新 "+ (upd.getMonth()+1)+"/"+upd.getDate()+" "+
      String(upd.getHours()).padStart(2,"0")+":"+String(upd.getMinutes()).padStart(2,"0")) : "";

    // 会社: すべて / 総合 / 専門 / 各社
    var cRow=document.getElementById("companyRow");
    var chips=[{key:"all",label:"すべて"},{key:"cat:総合",label:"総合商社"},{key:"cat:専門",label:"専門商社"}];
    (DATA.companies||[]).forEach(function(c){ chips.push({key:c.id,label:c.name}); });
    cRow.innerHTML="";
    chips.forEach(function(ch){
      var b=document.createElement("button");
      b.className="chip"; b.textContent=ch.label;
      b.setAttribute("aria-pressed", state.scope===ch.key ? "true":"false");
      b.onclick=function(){ state.scope=ch.key; render(); };
      cRow.appendChild(b);
    });

    var tRow=document.getElementById("tagRow");
    tRow.innerHTML="";
    // 「全タグ」は # を付けない通常チップ
    var allWrap=document.createElement("button");
    allWrap.className="chip"; allWrap.textContent="全タグ";
    allWrap.setAttribute("aria-pressed", state.tag===null?"true":"false");
    allWrap.onclick=function(){ state.tag=null; render(); };
    tRow.appendChild(allWrap);
    (DATA.tags||[]).forEach(function(t){
      var b=document.createElement("button");
      b.className="chip tag"; b.textContent=t;
      b.setAttribute("aria-pressed", state.tag===t ? "true":"false");
      b.onclick=function(){ state.tag = (state.tag===t? null : t); render(); };
      tRow.appendChild(b);
    });
  }

  function matchScope(a){
    if(state.scope==="all") return true;
    if(state.scope.indexOf("cat:")===0){
      var cat=state.scope.slice(4);
      return (a.company_ids||[]).some(function(id){ return companyMap[id] && companyMap[id].category===cat; });
    }
    return (a.company_ids||[]).indexOf(state.scope)>=0;
  }
  function matchTag(a){ return state.tag===null || (a.tags||[]).indexOf(state.tag)>=0; }
  function matchQ(a){
    if(!state.q) return true;
    var q=state.q.toLowerCase();
    var hay=(a.title+" "+(a.summary||"")+" "+(a.source||"")+" "+
      (a.company_ids||[]).map(function(id){return companyMap[id]?companyMap[id].name:"";}).join(" ")+" "+
      (a.tags||[]).join(" ")).toLowerCase();
    return hay.indexOf(q)>=0;
  }

  function render(){
    // チップの押下状態を更新
    document.querySelectorAll("#companyRow .chip").forEach(function(b){
      var label=b.textContent;
      var key = label==="すべて"?"all":label==="総合商社"?"cat:総合":label==="専門商社"?"cat:専門":
        (DATA.companies.find(function(c){return c.name===label;})||{}).id;
      b.setAttribute("aria-pressed", state.scope===key?"true":"false");
    });
    document.querySelectorAll("#tagRow .chip").forEach(function(b){
      var t=b.textContent;
      if(t==="全タグ") b.setAttribute("aria-pressed", state.tag===null?"true":"false");
      else b.setAttribute("aria-pressed", state.tag===t?"true":"false");
    });

    var items=(DATA.articles||[]).filter(function(a){
      return matchScope(a)&&matchTag(a)&&matchQ(a);
    }).sort(function(x,y){ return new Date(y.published)-new Date(x.published); });

    var count=document.getElementById("count");
    count.innerHTML="";
    var c=document.createElement("span");
    c.textContent=items.length+" 件";
    count.appendChild(c);
    if(DATA.sample){
      var f=document.createElement("span");
      f.className="sample-flag"; f.textContent="サンプル表示中（本番データ未取得）";
      count.appendChild(f);
    }

    var list=document.getElementById("list");
    list.innerHTML="";
    if(items.length===0){
      list.innerHTML='<div class="empty"><b>該当するニュースがありません</b><br>'+
        '絞り込みや検索条件を変えてみてください。'+
        '<br><button class="reset" id="resetBtn">条件をリセット</button></div>';
      document.getElementById("resetBtn").onclick=function(){
        state={scope:"all",tag:null,q:""};
        document.getElementById("q").value=""; render();
      };
      return;
    }
    var frag=document.createDocumentFragment();
    items.forEach(function(a){ frag.appendChild(card(a)); });
    list.appendChild(frag);
  }

  function card(a,opts){
    opts=opts||{};
    var el=document.createElement("article");
    el.className="card";

    if(opts.rank){
      var rl=document.createElement("div"); rl.className="rankline";
      rl.innerHTML='<span class="rank">'+opts.rank+'</span>';
      el.appendChild(rl);
    }

    var badges=document.createElement("div");
    badges.className="badges";
    (a.company_ids||[]).forEach(function(id){
      var c=companyMap[id]; if(!c) return;
      var b=document.createElement("span");
      b.className="badge "+(c.category==="総合"?"sogo":"senmon");
      b.textContent=c.name; badges.appendChild(b);
    });
    el.appendChild(badges);

    var t=document.createElement("a");
    t.className="title"; t.href=a.url||"#"; t.target="_blank"; t.rel="noopener noreferrer";
    t.textContent=a.title; el.appendChild(t);

    var src=document.createElement("div");
    src.className="src";
    var srcHtml=esc(a.source||"")+'<span class="dot"></span>'+esc(relTime(a.published));
    if((a.source_count||1)>1){
      srcHtml+='<span class="dot"></span><span class="mediacount">'+(a.source_count||1)+'媒体</span>';
    }
    src.innerHTML=srcHtml;
    el.appendChild(src);

    if(a.summary){
      var s=document.createElement("p"); s.className="summary"; s.textContent=a.summary;
      el.appendChild(s);
    }

    if((a.tags||[]).length){
      var ht=document.createElement("div"); ht.className="hashtags";
      a.tags.forEach(function(tag){
        var b=document.createElement("button");
        b.className="htag"; b.textContent="#"+tag;
        b.onclick=function(){ goNews(); state.tag=tag; window.scrollTo({top:0,behavior:"smooth"}); render(); };
        ht.appendChild(b);
      });
      el.appendChild(ht);
    }

    // 保存・メモの操作
    var it=getItem(a.id);
    var actions=document.createElement("div"); actions.className="actions";
    var btn=document.createElement("button"); btn.className="act";
    var saved = it && it.scraps.length>0;
    if(saved){ btn.classList.add("saved"); btn.innerHTML='<span class="ic">★</span>保存済み'; }
    else { btn.innerHTML='<span class="ic">☆</span>保存・メモ'; }
    btn.onclick=function(){ openSheet(a); };
    actions.appendChild(btn);
    if(it && memoHasText(it.memo)){
      var m=document.createElement("span"); m.className="saved-in";
      m.innerHTML='<span class="memo-dot"></span>メモあり';
      actions.appendChild(m);
    }
    el.appendChild(actions);

    if(saved){
      var si=document.createElement("div"); si.className="saved-in";
      si.innerHTML="保存先: "+it.scraps.map(function(sid){return '<b>'+esc(scrapName(sid))+'</b>';}).join("、");
      el.appendChild(si);
    }
    return el;
  }

  /* 保存済みスナップショットからカードを描く（フィードから消えても表示できる） */
  function cardFromItem(it){ return card(it.art); }

  /* =========================================================
     週次ダイジェスト
     ========================================================= */
  var JST = 9*3600*1000;
  // offset週の月曜0:00〜翌月曜0:00（日本時間）を絶対時刻で返す
  function weekRange(offset){
    var nowJ = new Date(Date.now()+JST);
    var y=nowJ.getUTCFullYear(), m=nowJ.getUTCMonth(), d=nowJ.getUTCDate();
    var dow=nowJ.getUTCDay();            // 0=日,1=月,...6=土
    var toMon=(dow+6)%7;                 // 月曜までの戻し日数
    var startMs = Date.UTC(y,m,d) - toMon*86400000 - offset*7*86400000 - JST;
    var endMs = startMs + 7*86400000;
    return {start:startMs, end:endMs};
  }
  function fmtRange(r){
    var s=new Date(r.start+JST), e=new Date(r.end+JST-86400000);
    return (s.getUTCMonth()+1)+"/"+s.getUTCDate()+"〜"+(e.getUTCMonth()+1)+"/"+e.getUTCDate();
  }
  var IMPORTANT_TAGS={"決算":3,"M&A":3,"業績予想":2,"人事":2,"提携":2,"投資":2,"株主還元":2,"就活":2,"脱炭素":1,"新規事業":1,"資源":1,"海外":1};
  function scoreArticle(a,r){
    var media=((a.source_count||1)-1)*2;                 // 媒体数（多いほど話題）
    var tag=0; (a.tags||[]).forEach(function(t){ tag+=(IMPORTANT_TAGS[t]||0); });
    var breadth=((a.company_ids||[]).length-1)*1;         // 複数社にまたがる話題
    var t=new Date(a.published).getTime();
    var rec=(r && r.end>r.start) ? (t-r.start)/(r.end-r.start) : 0;  // 週内で新しいほど僅かに加点
    return media+tag+breadth+rec;
  }
  function weekArticles(r){
    return (DATA.articles||[]).filter(function(a){
      var t=new Date(a.published).getTime();
      return !isNaN(t) && t>=r.start && t<r.end;
    });
  }

  function renderDigest(){
    var panel=document.getElementById("digestPanel");
    panel.innerHTML="";
    var r=weekRange(weekOffset);

    // 週の切り替え
    var nav=document.createElement("div"); nav.className="dg-nav";
    var prev=document.createElement("button"); prev.innerHTML="← 前の週";
    prev.onclick=function(){ weekOffset++; renderDigest(); };
    var label=document.createElement("div"); label.className="dg-range";
    label.textContent=(weekOffset===0?"今週　":weekOffset===1?"先週　":"")+fmtRange(r);
    var next=document.createElement("button"); next.innerHTML="次の週 →";
    next.disabled=(weekOffset<=0);
    next.onclick=function(){ if(weekOffset>0){weekOffset--; renderDigest();} };
    nav.appendChild(prev); nav.appendChild(label); nav.appendChild(next);
    panel.appendChild(nav);

    var arts=weekArticles(r);
    if(arts.length===0){
      var e=document.createElement("div"); e.className="dg-empty";
      e.innerHTML="この週のニュースはまだありません。<br>（アプリを使い始めた週より前には、さかのぼれません）";
      panel.appendChild(e);
      return;
    }

    // 全社の上位5件
    var scored=arts.map(function(a){ return {a:a,s:scoreArticle(a,r)}; })
      .sort(function(x,y){ return y.s-x.s; });
    var top=scored.slice(0,5);

    var topSec=document.createElement("div"); topSec.className="dg-sec dg-top";
    topSec.innerHTML='<div class="dg-sec-title"><h2>今週の注目</h2><span class="sub">上位'+top.length+'件</span></div>';
    var topList=document.createElement("div"); topList.className="list";
    top.forEach(function(o,i){ topList.appendChild(card(o.a,{rank:i+1})); });
    topSec.appendChild(topList);
    panel.appendChild(topSec);

    // 会社別（最大3件、該当なしは省略）
    (DATA.companies||[]).forEach(function(c){
      var list=arts.filter(function(a){ return (a.company_ids||[]).indexOf(c.id)>=0; })
        .map(function(a){ return {a:a,s:scoreArticle(a,r)}; })
        .sort(function(x,y){ return y.s-x.s; })
        .slice(0,3);
      if(list.length===0) return;
      var sec=document.createElement("div"); sec.className="dg-sec";
      sec.innerHTML='<div class="dg-sec-title"><h2><span class="cat '+
        (c.category==="総合"?"sogo":"senmon")+'">'+esc(c.category)+'</span>'+esc(c.name)+
        '</h2><span class="sub">'+list.length+'件</span></div>';
      var ul=document.createElement("div"); ul.className="list";
      list.forEach(function(o){ ul.appendChild(card(o.a)); });
      sec.appendChild(ul);
      panel.appendChild(sec);
    });
  }

  /* =========================================================
     ビュー切り替え（下部メニュー）
     ========================================================= */
  var VIEW_TITLES = {news:"商社就活ニュース",scraps:"スクラップ",digest:"週次ダイジェスト",companies:"個社研究"};

  function setView(v){
    currentView=v;
    ["news","scraps","digest","companies"].forEach(function(name){
      document.getElementById("view-"+name).hidden = (name!==v);
    });
    document.getElementById("viewTitle").textContent = VIEW_TITLES[v];
    // ニュース画面だけ 検索・絞り込みを表示
    var onNews = (v==="news");
    document.getElementById("searchBox").hidden = !onNews;
    document.getElementById("filters").hidden = !onNews;
    // タブの選択状態
    document.querySelectorAll("#tabbar button").forEach(function(b){
      b.setAttribute("aria-current", b.getAttribute("data-view")===v ? "true":"false");
    });
    try{ location.hash = v; }catch(e){}
    window.scrollTo({top:0});
    if(v==="news") render();
    if(v==="scraps") renderScraps();
    if(v==="digest") renderDigest();
  }
  function goNews(){ if(currentView!=="news") setView("news"); }

  document.querySelectorAll("#tabbar button").forEach(function(b){
    b.addEventListener("click",function(){ setView(b.getAttribute("data-view")); });
  });

  /* =========================================================
     スクラップ画面
     ========================================================= */
  function renderScraps(){
    var panel=document.getElementById("scrapsPanel");
    panel.innerHTML="";
    if(scrapView.mode==="detail"){ renderScrapDetail(panel); return; }
    if(scrapView.mode==="backup"){ renderBackup(panel); return; }

    // 一覧
    var head=document.createElement("div"); head.className="panel-head";
    var add=document.createElement("button"); add.className="pbtn primary";
    add.innerHTML="＋ 新しいスクラップ";
    add.onclick=function(){
      openInputSheet("スクラップの名前を入力","",function(name){
        createScrap((name||"").trim()||"無題のスクラップ"); renderScraps();
      });
    };
    var bk=document.createElement("button"); bk.className="pbtn ghost";
    bk.innerHTML="バックアップ";
    bk.onclick=function(){ scrapView.mode="backup"; renderScraps(); };
    head.appendChild(add); head.appendChild(bk);
    panel.appendChild(head);

    if(!storageOK){
      var warn=document.createElement("div"); warn.className="soon";
      warn.innerHTML="<p>この端末ではデータを保存できない設定になっています。プライベートブラウズを解除するか、ホーム画面に追加したアプリから開いてください。</p>";
      panel.appendChild(warn);
    }

    if(STORE.scraps.length===0 && memoOnlyItems().length===0){
      var e=document.createElement("div"); e.className="soon";
      e.innerHTML="<h2>まだスクラップがありません</h2>"+
        "<p>「ニュース」画面で記事の「☆ 保存・メモ」を押すと、ここに保存できます。</p>"+
        "<p>用途ごとに名前を付けて、複数のスクラップを使い分けられます。</p>";
      panel.appendChild(e);
    }

    var list=document.createElement("div"); list.className="list";
    STORE.scraps.forEach(function(s){
      var c=document.createElement("div"); c.className="scrap-card"; c.tabIndex=0;
      c.innerHTML='<span class="sc-name">'+esc(s.name)+'</span><span class="sc-count">'+scrapCount(s.id)+' 件</span>';
      c.onclick=function(){ scrapView={mode:"detail",scrapId:s.id}; renderScraps(); };
      c.onkeydown=function(ev){ if(ev.key==="Enter"){c.click();} };
      list.appendChild(c);
    });
    var mo=memoOnlyItems();
    if(mo.length){
      var c=document.createElement("div"); c.className="scrap-card system"; c.tabIndex=0;
      c.innerHTML='<span class="sc-name">メモのみ（スクラップ未分類）</span><span class="sc-count">'+mo.length+' 件</span>';
      c.onclick=function(){ scrapView={mode:"detail",scrapId:"__memo__"}; renderScraps(); };
      c.onkeydown=function(ev){ if(ev.key==="Enter"){c.click();} };
      list.appendChild(c);
    }
    panel.appendChild(list);
  }

  function renderScrapDetail(panel){
    var isMemo = scrapView.scrapId==="__memo__";
    var head=document.createElement("div"); head.className="detail-head";
    var back=document.createElement("button"); back.className="iconbtn"; back.innerHTML="←";
    back.setAttribute("aria-label","戻る");
    back.onclick=function(){ scrapView={mode:"list",scrapId:null}; renderScraps(); };
    var h=document.createElement("h2");
    h.textContent = isMemo ? "メモのみ（未分類）" : scrapName(scrapView.scrapId);
    head.appendChild(back); head.appendChild(h);

    if(!isMemo){
      var ren=document.createElement("button"); ren.className="iconbtn"; ren.innerHTML="✎";
      ren.setAttribute("aria-label","名前を変更");
      ren.onclick=function(){
        openInputSheet("新しい名前",scrapName(scrapView.scrapId),function(name){
          renameScrap(scrapView.scrapId,(name||"").trim()||"無題のスクラップ"); renderScraps();
        });
      };
      var del=document.createElement("button"); del.className="iconbtn"; del.innerHTML="🗑";
      del.setAttribute("aria-label","削除"); del.style.color="var(--danger)";
      del.onclick=function(){
        confirmLine("このスクラップを削除しますか？（記事のメモは残ります）",function(){
          deleteScrap(scrapView.scrapId); scrapView={mode:"list",scrapId:null}; renderScraps();
          toast("スクラップを削除しました");
        });
      };
      head.appendChild(ren); head.appendChild(del);
    }
    panel.appendChild(head);

    var items = isMemo ? memoOnlyItems() : itemsInScrap(scrapView.scrapId);
    if(items.length===0){
      var e=document.createElement("div"); e.className="soon";
      e.innerHTML="<p>この中にはまだ記事がありません。</p>";
      panel.appendChild(e);
      return;
    }
    var list=document.createElement("div"); list.className="list";
    items.forEach(function(it){ list.appendChild(cardFromItem(it)); });
    panel.appendChild(list);
  }

  /* =========================================================
     バックアップ（コピー／貼り付けで復元）
     ========================================================= */
  function renderBackup(panel){
    var head=document.createElement("div"); head.className="detail-head";
    var back=document.createElement("button"); back.className="iconbtn"; back.innerHTML="←";
    back.setAttribute("aria-label","戻る");
    back.onclick=function(){ scrapView={mode:"list",scrapId:null}; renderScraps(); };
    var h=document.createElement("h2"); h.textContent="バックアップ";
    head.appendChild(back); head.appendChild(h);
    panel.appendChild(head);

    panel.insertAdjacentHTML("beforeend",
      '<p class="hint">スマホを買い替えたときや、データが消えたときのための控えです。'+
      '下の文字を全部コピーして、メモアプリなどに保存しておいてください。</p>');

    var ta=document.createElement("textarea"); ta.className="backup-area"; ta.readOnly=true;
    ta.value=JSON.stringify(STORE);
    panel.appendChild(ta);

    var row=document.createElement("div"); row.className="sheet-actions";
    var copy=document.createElement("button"); copy.className="pbtn primary"; copy.textContent="コピーする";
    copy.onclick=function(){
      var done=function(){ toast("コピーしました"); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(done).catch(function(){ ta.select(); toast("長押しでコピーしてください"); });
      } else { ta.select(); toast("長押しでコピーしてください"); }
    };
    row.appendChild(copy);
    panel.appendChild(row);

    panel.insertAdjacentHTML("beforeend",
      '<p class="hint" style="margin-top:22px">控えから戻すとき: 保存しておいた文字を下の欄に貼り付けて「読み込む」を押してください。'+
      '<br><b>今の内容は上書きされます。</b></p>');
    var imp=document.createElement("textarea"); imp.className="backup-area";
    imp.placeholder="ここにバックアップの文字を貼り付け";
    panel.appendChild(imp);
    var row2=document.createElement("div"); row2.className="sheet-actions";
    var load=document.createElement("button"); load.className="pbtn danger"; load.textContent="読み込む（上書き）";
    load.onclick=function(){
      var val=imp.value.trim(); if(!val){ toast("貼り付けてください"); return; }
      var parsed; try{ parsed=JSON.parse(val); }catch(e){ toast("うまく読み取れませんでした"); return; }
      if(!parsed || typeof parsed!=="object" || !("items" in parsed)){ toast("バックアップの形式ではありません"); return; }
      confirmLine("今の保存内容を、貼り付けた内容で上書きします。よろしいですか？",function(){
        STORE={v:1,scraps:parsed.scraps||[],items:parsed.items||{}}; saveStore();
        scrapView={mode:"list",scrapId:null}; renderScraps(); toast("読み込みました");
      });
    };
    row2.appendChild(load);
    panel.appendChild(row2);
  }

  /* =========================================================
     ボトムシート（記事の保存・メモ）
     ========================================================= */
  var sheetHost=document.getElementById("sheetHost");

  function closeSheet(){ sheetHost.hidden=true; sheetHost.innerHTML=""; }

  function openSheet(art){
    var it=getItem(art.id);
    var checked = it ? it.scraps.slice() : [];
    var memo = it ? Object.assign(emptyMemo(), it.memo) : emptyMemo();

    sheetHost.innerHTML="";
    var bg=document.createElement("div"); bg.className="sheet-bg"; bg.onclick=closeSheet;
    var sheet=document.createElement("div"); sheet.className="sheet";
    sheetHost.appendChild(bg); sheetHost.appendChild(sheet);

    sheet.innerHTML='<div class="grip"></div>'+
      '<h3>'+esc(art.title)+'</h3>'+
      '<p class="s-src">'+esc(art.source||"")+'</p>';

    // スクラップ選択
    var sec1=document.createElement("div"); sec1.className="s-sec";
    sec1.innerHTML='<span class="lbl">スクラップに保存</span>';
    var opts=document.createElement("div"); opts.className="scrap-opts"; opts.id="scrapOpts";
    sec1.appendChild(opts);
    function drawOpts(){
      opts.innerHTML="";
      if(STORE.scraps.length===0){
        opts.insertAdjacentHTML("beforeend",'<p class="hint" style="margin:0">まだスクラップがありません。下で新しく作れます。</p>');
      }
      STORE.scraps.forEach(function(s){
        var lab=document.createElement("label"); lab.className="opt";
        var cb=document.createElement("input"); cb.type="checkbox"; cb.value=s.id;
        cb.checked = checked.indexOf(s.id)>=0;
        cb.onchange=function(){
          if(cb.checked){ if(checked.indexOf(s.id)<0) checked.push(s.id); }
          else { checked=checked.filter(function(x){return x!==s.id;}); }
        };
        var sp=document.createElement("span"); sp.textContent=s.name;
        lab.appendChild(cb); lab.appendChild(sp); opts.appendChild(lab);
      });
    }
    drawOpts();
    var ns=document.createElement("div"); ns.className="newscrap";
    var nsin=document.createElement("input"); nsin.type="text"; nsin.placeholder="新しいスクラップ名";
    var nsb=document.createElement("button"); nsb.className="pbtn"; nsb.textContent="作成";
    nsb.onclick=function(){
      var nm=nsin.value.trim(); if(!nm) return;
      var id=createScrap(nm); checked.push(id); nsin.value=""; drawOpts();
    };
    ns.appendChild(nsin); ns.appendChild(nsb);
    sec1.appendChild(ns);
    sheet.appendChild(sec1);

    // メモ 4欄
    var sec2=document.createElement("div"); sec2.className="s-sec";
    sec2.innerHTML='<span class="lbl">メモ</span>';
    var fields=[["opinion","自分の意見"],["talk","面接で話せる一言"],["question","逆質問のネタ"],["other","その他（自由記述）"]];
    var tas={};
    fields.forEach(function(f){
      var wrap=document.createElement("div"); wrap.className="memo-field";
      var lb=document.createElement("label"); lb.textContent=f[1];
      var id="memo_"+f[0]; lb.setAttribute("for",id);
      var ta=document.createElement("textarea"); ta.id=id; ta.value=memo[f[0]]||"";
      tas[f[0]]=ta;
      wrap.appendChild(lb); wrap.appendChild(ta); sec2.appendChild(wrap);
    });
    sheet.appendChild(sec2);

    // 操作ボタン
    var acts=document.createElement("div"); acts.className="sheet-actions";
    var cancel=document.createElement("button"); cancel.className="pbtn ghost"; cancel.textContent="閉じる";
    cancel.onclick=closeSheet;
    var save=document.createElement("button"); save.className="pbtn primary"; save.textContent="保存";
    save.onclick=function(){
      var m={opinion:tas.opinion.value.trim(),talk:tas.talk.value.trim(),
             question:tas.question.value.trim(),other:tas.other.value.trim()};
      var willSave = checked.length>0 || memoHasText(m);
      if(!willSave){
        // 既存があれば解除扱い
        if(STORE.items[art.id]){ STORE.items[art.id].scraps=[]; STORE.items[art.id].memo=emptyMemo(); cleanupItem(art.id); saveStore(); }
        closeSheet(); refreshCurrent(); toast("保存を解除しました"); return;
      }
      var item=ensureItem(art);
      item.scraps = checked.slice();
      item.memo = m;
      cleanupItem(art.id);
      saveStore(); closeSheet(); refreshCurrent(); toast("保存しました");
    };
    acts.appendChild(cancel); acts.appendChild(save);
    sheet.appendChild(acts);

    sheetHost.hidden=false;
  }

  /* 画面上の見た目を、現在のビューに合わせて更新 */
  function refreshCurrent(){
    if(currentView==="news") render();
    else if(currentView==="scraps") renderScraps();
    else if(currentView==="digest") renderDigest();
  }

  /* =========================================================
     自前の入力・確認（alert/prompt/confirm は環境により無効なため）
     ========================================================= */
  function openInputSheet(label,initial,onOk){
    sheetHost.innerHTML="";
    var bg=document.createElement("div"); bg.className="sheet-bg"; bg.onclick=closeSheet;
    var sheet=document.createElement("div"); sheet.className="sheet";
    sheet.innerHTML='<div class="grip"></div><h3>'+esc(label)+'</h3>';
    var wrap=document.createElement("div"); wrap.className="newscrap"; wrap.style.marginTop="2px";
    var inp=document.createElement("input"); inp.type="text"; inp.value=initial||"";
    wrap.appendChild(inp); sheet.appendChild(wrap);
    var acts=document.createElement("div"); acts.className="sheet-actions"; acts.style.marginTop="16px";
    var no=document.createElement("button"); no.className="pbtn ghost"; no.textContent="やめる"; no.onclick=closeSheet;
    var ok=document.createElement("button"); ok.className="pbtn primary"; ok.textContent="決定";
    ok.onclick=function(){ var v=inp.value; closeSheet(); onOk(v); };
    inp.addEventListener("keydown",function(ev){ if(ev.key==="Enter") ok.click(); });
    acts.appendChild(no); acts.appendChild(ok); sheet.appendChild(acts);
    sheetHost.appendChild(bg); sheetHost.appendChild(sheet); sheetHost.hidden=false;
    setTimeout(function(){ try{inp.focus();}catch(e){} },60);
  }
  function confirmLine(msg,onYes){
    // confirm はアーティファクト/一部環境で無効のため自前のミニシート
    sheetHost.innerHTML="";
    var bg=document.createElement("div"); bg.className="sheet-bg"; bg.onclick=function(){closeSheet();};
    var sheet=document.createElement("div"); sheet.className="sheet";
    sheet.innerHTML='<div class="grip"></div><h3>確認</h3><p class="s-src" style="font-size:.9rem;color:var(--fg)">'+esc(msg)+'</p>';
    var acts=document.createElement("div"); acts.className="sheet-actions";
    var no=document.createElement("button"); no.className="pbtn ghost"; no.textContent="やめる"; no.onclick=closeSheet;
    var yes=document.createElement("button"); yes.className="pbtn danger"; yes.textContent="実行する";
    yes.onclick=function(){ closeSheet(); onYes(); };
    acts.appendChild(no); acts.appendChild(yes); sheet.appendChild(acts);
    sheetHost.appendChild(bg); sheetHost.appendChild(sheet); sheetHost.hidden=false;
  }

  // 検索入力
  var qEl=document.getElementById("q");
  var timer=null;
  qEl.addEventListener("input",function(){
    clearTimeout(timer);
    timer=setTimeout(function(){ state.q=qEl.value.trim(); render(); },120);
  });

  // フッター
  document.getElementById("foot").innerHTML=
    "見出し・出典・元記事へのリンクを表示します。記事タップで元記事（別タブ）に移動します。<br>"+
    "保存したスクラップとメモは、この端末の中だけに保存されます。";

  // データ読み込み: GitHub Pages では data/news.json を読む。失敗時はサンプル。
  function init(){
    if(location.protocol==="file:"){ boot(loadFallback()); return; }
    fetch("./data/news.json",{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ boot(j); })
      .catch(function(){ boot(loadFallback()); });
  }
  init();

  // 起動時のビュー（ハッシュから復元。ただし不正値はニュース）
  (function(){
    var h=(location.hash||"").replace("#","");
    if(["scraps","digest","companies"].indexOf(h)>=0){ setTimeout(function(){ setView(h); },0); }
  })();

  // PWA（GitHub Pages のときだけ登録。artifact ドメインでは登録しない）
  if("serviceWorker" in navigator && location.protocol==="https:" &&
     !/claude|anthropic|artifact/i.test(location.hostname)){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  }
})();
</script>
