<style>
  /* レイアウト概念: スマホ縦1カラム。固定ヘッダー(タイトル+検索+絞り込み)の下に記事カードを積む。 */
  :root{
    --bg:#f5f4f1; --surface:#ffffff; --surface-2:#fbfaf8;
    --fg:#1a1f2b; --muted:#616b7a; --line:#e6e3dc;
    --accent:#1f3a5f; --accent-ink:#1f3a5f; --accent-soft:#e9eff6;
    --sogo-bg:#e7edf5; --sogo-ink:#28426a;
    --senmon-bg:#e8f1ec; --senmon-ink:#2f6b4f;
    --tag-bg:#f0eee8; --tag-ink:#5a5244;
    --font-display:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
    --font-body:"Noto Sans JP",system-ui,-apple-system,sans-serif;
    --r:14px; --maxw:640px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#13161c; --surface:#1b1f27; --surface-2:#1f242d;
    --fg:#eceef2; --muted:#98a1b0; --line:#2b313c;
    --accent:#7aa6d6; --accent-ink:#9cc0e6; --accent-soft:#223243;
    --sogo-bg:#20303f; --sogo-ink:#9cc0e6;
    --senmon-bg:#1e3329; --senmon-ink:#7fc39e;
    --tag-bg:#262a31; --tag-ink:#b7b0a2;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#13161c; --surface:#1b1f27; --surface-2:#1f242d;
    --fg:#eceef2; --muted:#98a1b0; --line:#2b313c;
    --accent:#7aa6d6; --accent-ink:#9cc0e6; --accent-soft:#223243;
    --sogo-bg:#20303f; --sogo-ink:#9cc0e6;
    --senmon-bg:#1e3329; --senmon-ink:#7fc39e;
    --tag-bg:#262a31; --tag-ink:#b7b0a2;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);
    line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
    background:var(--accent);z-index:30}

  .wrap{max-width:var(--maxw);margin:0 auto}

  /* ---- ヘッダー ---- */
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    background:var(--accent);color:#fff}
  .head-inner{max-width:var(--maxw);margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:12px 10px}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .brand h1{font-family:var(--font-display);font-weight:700;font-size:1.18rem;
    margin:0;letter-spacing:.02em}
  .brand .meta{font-size:.72rem;opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
  .search{margin-top:10px;position:relative}
  .search input{width:100%;border:0;border-radius:11px;padding:10px 12px 10px 38px;
    font-size:.95rem;font-family:inherit;background:rgba(255,255,255,.95);color:#1a1f2b}
  .search input::placeholder{color:#8a93a0}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;opacity:.55}
  .search input:focus{outline:2px solid #fff;outline-offset:1px}

  /* ---- 絞り込みチップ ---- */
  .filters{background:var(--surface);border-bottom:1px solid var(--line);
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 0px);z-index:10}
  .chip-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:10px}
  .chip-row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);
    color:var(--fg);border-radius:999px;padding:6px 13px;font-size:.84rem;
    font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
  .tag-wrap{border-top:1px dashed var(--line)}
  .tag-row{flex-wrap:wrap;overflow:visible}
  .chip.tag{font-size:.8rem;padding:5px 11px}
  .chip.tag::before{content:"#";opacity:.5;margin-right:1px}
  .chip.tag[aria-pressed="true"]::before{opacity:.8}

  /* ---- リスト ---- */
  main{max-width:var(--maxw);margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:14px 40px}
  .count{font-size:.78rem;color:var(--muted);margin:2px 2px 12px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sample-flag{background:#f4e6c3;color:#6b541a;border-radius:6px;
    padding:2px 8px;font-size:.72rem;font-weight:500}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sample-flag{background:#3a3115;color:#e4cf90}}
  :root[data-theme="dark"] .sample-flag{background:#3a3115;color:#e4cf90}
  .list{display:flex;flex-direction:column;gap:12px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
  .card .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;
    font-family:var(--font-display)}
  .badge.sogo{background:var(--sogo-bg);color:var(--sogo-ink)}
  .badge.senmon{background:var(--senmon-bg);color:var(--senmon-ink)}
  .card a.title{font-family:var(--font-display);font-weight:700;font-size:1.02rem;
    line-height:1.45;color:var(--fg);text-decoration:none;text-wrap:balance}
  .card a.title:hover{color:var(--accent-ink)}
  .card .src{font-size:.75rem;color:var(--muted);display:flex;gap:6px;align-items:center;
    font-variant-numeric:tabular-nums}
  .card .src .dot{width:3px;height:3px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .card .summary{font-size:.9rem;color:var(--fg);opacity:.92;margin:0}
  .card .hashtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
  .htag{font-size:.78rem;color:var(--accent-ink);background:var(--tag-bg);
    border:0;border-radius:7px;padding:3px 9px;cursor:pointer;font-family:inherit;
    font-weight:500}
  .htag:hover{background:var(--accent-soft)}
  .htag:focus-visible{outline:2px solid var(--accent-ink);outline-offset:1px}

  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:.92rem}
  .empty b{color:var(--fg)}
  .reset{margin-top:14px;background:var(--accent);color:#fff;border:0;border-radius:10px;
    padding:9px 16px;font-size:.86rem;cursor:pointer;font-family:inherit}

  footer{max-width:var(--maxw);margin:0 auto;color:var(--muted);font-size:.72rem;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:0 32px;line-height:1.7}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
  "use strict";
  var DATA = null;
  var state = { scope:"all", tag:null, q:"" };
  var companyMap = {};

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function relTime(iso){
    var d=new Date(iso), now=new Date(), ms=now-d;
    if(isNaN(d)) return "";
    var min=Math.floor(ms/60000), h=Math.floor(min/60), day=Math.floor(h/24);
    if(min<1) return "たった今";
    if(min<60) return min+"分前";
    if(h<24) return h+"時間前";
    if(day<7) return day+"日前";
    return (d.getMonth()+1)+"月"+d.getDate()+"日";
  }

  function loadFallback(){
    try{ return JSON.parse(document.getElementById("fallback").textContent); }
    catch(e){ return {companies:[],tags:[],articles:[]}; }
  }

  function boot(data){
    DATA = data || loadFallback();
    (DATA.companies||[]).forEach(function(c){ companyMap[c.id]=c; });
    renderChrome();
    render();
  }

  // 会社チップ・タグチップ・更新情報
  function renderChrome(){
    var meta=document.getElementById("meta");
    var upd = DATA.updated_at ? new Date(DATA.updated_at) : null;
    meta.textContent = upd ? ("更新 "+ (upd.getMonth()+1)+"/"+upd.getDate()+" "+
      String(upd.getHours()).padStart(2,"0")+":"+String(upd.getMinutes()).padStart(2,"0")) : "";

    // 会社: すべて / 総合 / 専門 / 各社
    var cRow=document.getElementById("companyRow");
    var chips=[{key:"all",label:"すべて"},{key:"cat:総合",label:"総合商社"},{key:"cat:専門",label:"専門商社"}];
    (DATA.companies||[]).forEach(function(c){ chips.push({key:c.id,label:c.name}); });
    cRow.innerHTML="";
    chips.forEach(function(ch){
      var b=document.createElement("button");
      b.className="chip"; b.textContent=ch.label;
      b.setAttribute("aria-pressed", state.scope===ch.key ? "true":"false");
      b.onclick=function(){ state.scope=ch.key; render(); };
      cRow.appendChild(b);
    });

    var tRow=document.getElementById("tagRow");
    tRow.innerHTML="";
    // 「全タグ」は # を付けない通常チップ
    var allWrap=document.createElement("button");
    allWrap.className="chip"; allWrap.textContent="全タグ";
    allWrap.setAttribute("aria-pressed", state.tag===null?"true":"false");
    allWrap.onclick=function(){ state.tag=null; render(); };
    tRow.appendChild(allWrap);
    (DATA.tags||[]).forEach(function(t){
      var b=document.createElement("button");
      b.className="chip tag"; b.textContent=t;
      b.setAttribute("aria-pressed", state.tag===t ? "true":"false");
      b.onclick=function(){ state.tag = (state.tag===t? null : t); render(); };
      tRow.appendChild(b);
    });
  }

  function matchScope(a){
    if(state.scope==="all") return true;
    if(state.scope.indexOf("cat:")===0){
      var cat=state.scope.slice(4);
      return (a.company_ids||[]).some(function(id){ return companyMap[id] && companyMap[id].category===cat; });
    }
    return (a.company_ids||[]).indexOf(state.scope)>=0;
  }
  function matchTag(a){ return state.tag===null || (a.tags||[]).indexOf(state.tag)>=0; }
  function matchQ(a){
    if(!state.q) return true;
    var q=state.q.toLowerCase();
    var hay=(a.title+" "+(a.summary||"")+" "+(a.source||"")+" "+
      (a.company_ids||[]).map(function(id){return companyMap[id]?companyMap[id].name:"";}).join(" ")+" "+
      (a.tags||[]).join(" ")).toLowerCase();
    return hay.indexOf(q)>=0;
  }

  function render(){
    // チップの押下状態を更新
    document.querySelectorAll("#companyRow .chip").forEach(function(b){
      var label=b.textContent;
      var key = label==="すべて"?"all":label==="総合商社"?"cat:総合":label==="専門商社"?"cat:専門":
        (DATA.companies.find(function(c){return c.name===label;})||{}).id;
      b.setAttribute("aria-pressed", state.scope===key?"true":"false");
    });
    document.querySelectorAll("#tagRow .chip").forEach(function(b){
      var t=b.textContent;
      if(t==="全タグ") b.setAttribute("aria-pressed", state.tag===null?"true":"false");
      else b.setAttribute("aria-pressed", state.tag===t?"true":"false");
    });

    var items=(DATA.articles||[]).filter(function(a){
      return matchScope(a)&&matchTag(a)&&matchQ(a);
    }).sort(function(x,y){ return new Date(y.published)-new Date(x.published); });

    var count=document.getElementById("count");
    count.innerHTML="";
    var c=document.createElement("span");
    c.textContent=items.length+" 件";
    count.appendChild(c);
    if(DATA.sample){
      var f=document.createElement("span");
      f.className="sample-flag"; f.textContent="サンプル表示中（本番データ未取得）";
      count.appendChild(f);
    }

    var list=document.getElementById("list");
    list.innerHTML="";
    if(items.length===0){
      list.innerHTML='<div class="empty"><b>該当するニュースがありません</b><br>'+
        '絞り込みや検索条件を変えてみてください。'+
        '<br><button class="reset" id="resetBtn">条件をリセット</button></div>';
      document.getElementById("resetBtn").onclick=function(){
        state={scope:"all",tag:null,q:""};
        document.getElementById("q").value=""; render();
      };
      return;
    }
    var frag=document.createDocumentFragment();
    items.forEach(function(a){ frag.appendChild(card(a)); });
    list.appendChild(frag);
  }

  function card(a){
    var el=document.createElement("article");
    el.className="card";

    var badges=document.createElement("div");
    badges.className="badges";
    (a.company_ids||[]).forEach(function(id){
      var c=companyMap[id]; if(!c) return;
      var b=document.createElement("span");
      b.className="badge "+(c.category==="総合"?"sogo":"senmon");
      b.textContent=c.name; badges.appendChild(b);
    });
    el.appendChild(badges);

    var t=document.createElement("a");
    t.className="title"; t.href=a.url||"#"; t.target="_blank"; t.rel="noopener noreferrer";
    t.textContent=a.title; el.appendChild(t);

    var src=document.createElement("div");
    src.className="src";
    src.innerHTML=esc(a.source||"")+'<span class="dot"></span>'+esc(relTime(a.published));
    el.appendChild(src);

    if(a.summary){
      var s=document.createElement("p"); s.className="summary"; s.textContent=a.summary;
      el.appendChild(s);
    }

    if((a.tags||[]).length){
      var ht=document.createElement("div"); ht.className="hashtags";
      a.tags.forEach(function(tag){
        var b=document.createElement("button");
        b.className="htag"; b.textContent="#"+tag;
        b.onclick=function(){ state.tag=tag; window.scrollTo({top:0,behavior:"smooth"}); render(); };
        ht.appendChild(b);
      });
      el.appendChild(ht);
    }
    return el;
  }

  // 検索入力
  var qEl=document.getElementById("q");
  var timer=null;
  qEl.addEventListener("input",function(){
    clearTimeout(timer);
    timer=setTimeout(function(){ state.q=qEl.value.trim(); render(); },120);
  });

  // フッター
  document.getElementById("foot").innerHTML=
    "見出し・出典・元記事へのリンクを表示します。記事タップで元記事（別タブ）に移動します。<br>"+
    "個人の就活準備用。ニュースは Google ニュース等から自動収集しています。";

  // データ読み込み: GitHub Pages では data/news.json を読む。失敗時はサンプル。
  function init(){
    if(location.protocol==="file:"){ boot(loadFallback()); return; }
    fetch("./data/news.json",{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ boot(j); })
      .catch(function(){ boot(loadFallback()); });
  }
  init();

  // PWA（GitHub Pages のときだけ登録。artifact ドメインでは登録しない）
  if("serviceWorker" in navigator && location.protocol==="https:" &&
     !/claude|anthropic|artifact/i.test(location.hostname)){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  }
})();
</script>
